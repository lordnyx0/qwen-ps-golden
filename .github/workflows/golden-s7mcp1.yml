# golden-s7mcp1.yml — goldens S7 parte 1 (200 write-family MCP, ubuntu).
# Disparo manual. Nada executa no host do dev (jail /tmp no runner descartavel).
name: s7mcp1-golden

on:
  workflow_dispatch: {}

jobs:
  s7mcp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/golden
          sparse-checkout-cone-mode: false
      - name: Collect S7MCP1 goldens
        shell: bash
        run: python3 .github/golden/collect-bash.py --calls .github/golden/s7/mcp1_calls.jsonl --out .github/golden/out/s7mcp1_results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: s7mcp1_results
          path: .github/golden/out/s7mcp1_results.jsonl
          retention-days: 30

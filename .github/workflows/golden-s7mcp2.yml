# golden-s7mcp2.yml — goldens S7 parte 2 (350 reads/searches MCP, ubuntu).
# Disparo manual. Nada executa no host do dev (jail /tmp no runner descartavel).
name: s7mcp2-golden

on:
  workflow_dispatch: {}

jobs:
  s7mcp2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/golden
          sparse-checkout-cone-mode: false
      - name: Collect S7MCP2 goldens
        shell: bash
        run: python3 .github/golden/collect-bash.py --calls .github/golden/s7/mcp2_calls.jsonl --out .github/golden/out/s7mcp2_results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: s7mcp2_results
          path: .github/golden/out/s7mcp2_results.jsonl
          retention-days: 30

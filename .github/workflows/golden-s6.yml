# golden-s6.yml — goldens do lote S6 (73 amostras novas).
# Disparo manual. Nada executa no host do dev.
name: s6-golden

on:
  workflow_dispatch: {}

jobs:
  s6-ps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/golden
          sparse-checkout-cone-mode: false
      - name: Collect S6 PowerShell goldens
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github/golden/collect-ps.ps1 -Calls .github/golden/s6/g6_ps_calls.jsonl -Out .github/golden/out/s6_ps_results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: s6_ps_results
          path: .github/golden/out/s6_ps_results.jsonl
          retention-days: 30

  s6-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/golden
          sparse-checkout-cone-mode: false
      - name: Collect S6 bash goldens
        shell: bash
        run: python3 .github/golden/collect-bash.py --calls .github/golden/s6/g6_bash_calls.jsonl --out .github/golden/out/s6_bash_results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: s6_bash_results
          path: .github/golden/out/s6_bash_results.jsonl
          retention-days: 30
